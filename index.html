<meta charset="utf-8">
<title>RYC Yard Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: a working board. Yard photo fills the room; one control panel beside it (below it on phones). */
:root {
  --bg: #e9eff1; --panel: #ffffff; --ink: #12303f; --muted: #557080; --line: #cfdbe0;
  --accent: #0b6c7d; --accent-ink: #ffffff; --soft: #dfeaed; --warn: #b4530b; --warn-soft: #fbead9;
  --bad: #b3261e; --bad-soft: #f9e3e1; --good: #1c7a3f; --mark: #ffe58a;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif; --body: "Barlow", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1a21; --panel: #15252e; --ink: #e4eef2; --muted: #93aab6; --line: #2a404c; --accent: #58c4d6; --accent-ink: #06222a;
  --soft: #1f3540; --warn: #f2a65e; --warn-soft: #3a2a18; --bad: #f28b82; --bad-soft: #3b1f1d; --good: #6fd597; --mark: #6b5a10; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d1a21; --panel: #15252e; --ink: #e4eef2; --muted: #93aab6; --line: #2a404c; --accent: #58c4d6; --accent-ink: #06222a;
  --soft: #1f3540; --warn: #f2a65e; --warn-soft: #3a2a18; --bad: #f28b82; --bad-soft: #3b1f1d; --good: #6fd597; --mark: #6b5a10; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { height: 100%; margin: 0 }
body { background: var(--bg); color: var(--ink); font: 15px/1.4 var(--body); display: flex; flex-direction: column; overflow: hidden }
button, input, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
mark { background: var(--mark); color: inherit; border-radius: 2px }

header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
h1 { font: 700 22px/1 var(--display); letter-spacing: .01em; margin: 0 }
.yards { display: flex; gap: 2px; background: var(--soft); border-radius: 8px; padding: 3px }
.yards button { border: 0; background: none; padding: 5px 12px; border-radius: 6px; font-weight: 600 }
.yards button[aria-pressed="true"] { background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.2) }
.stamp { flex: 0 1 auto; max-width: 260px; color: var(--muted); font-size: 13px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
#openUpload { margin-left: auto; flex: none }
h1, .yards { flex: none; white-space: nowrap }
@media (min-width: 821px) { header { flex-wrap: nowrap } #legend { flex: 1 1 0 } }
@media (min-width: 821px) and (max-width: 1000px) { h1 { display: none } }
#legend { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px; font-size: 13px; color: var(--muted); min-width: 0 }
#legend span { white-space: nowrap }
.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 7px 14px; font-weight: 600 }
.ghost { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-weight: 500 }
.also { padding: 2px 0 6px }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 2px }

main { flex: 1; min-height: 0; display: grid; grid-template-columns: 350px minmax(0, 1fr) }
#panel { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0 }
.tabs { display: flex; border-bottom: 1px solid var(--line) }
.tabs button { flex: 1 1 auto; border: 0; background: none; padding: 10px 6px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent) }
.count { display: inline-block; min-width: 20px; padding: 0 5px; border-radius: 10px; background: var(--bad-soft); color: var(--bad); font-size: 12px; font-weight: 700 }
.pane { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 12px }
.label { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; margin-bottom: 5px }
#q { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 16px }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.fchip { border: 1px solid var(--line); background: none; border-radius: 16px; padding: 3px 10px; font-size: 14px; font-weight: 500 }
.fchip b { font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 3px }
.fchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.fchip[aria-pressed="true"] b { color: inherit }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px }
.rowhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px }
#results, .vlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column }
#results li + li, .vlist li + li { border-top: 1px solid var(--line) }
.vyard { margin: 10px 0 0; border-top: 0 !important }
.vlist > .vyard:first-child, #results > .vyard:first-child { margin-top: 0 }
.vhead { width: 100%; display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 10px 4px; font-weight: 600; text-align: left }
.vhead:hover { background: var(--soft) }
.vhead[aria-expanded="true"] { color: var(--accent) }
.vhead .swatch { margin: 0; flex: none; outline: 1px solid var(--line) }
.vhead span { flex: 1; min-width: 0 }
.vhead b { font-variant-numeric: tabular-nums; color: var(--good) }
.vhead i.chev { font-style: normal; color: var(--muted); width: 12px; text-align: center }
.vinner { padding-left: 8px; border-left: 3px solid var(--line); margin-bottom: 8px }
.res { width: 100%; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; background: none; border: 0; text-align: left; padding: 8px 4px; align-items: start }
.res:hover { background: var(--soft) }
.tag { font: 700 14px/1 var(--display); text-align: center; padding: 4px 3px; border-radius: 4px; font-variant-numeric: tabular-nums }
.res strong { font-weight: 600; display: block; overflow-wrap: anywhere }
.res small { color: var(--muted); font-size: 13px; display: block; overflow-wrap: anywhere }
.flags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px }
.flag { font-size: 12px; font-weight: 600; border-radius: 4px; padding: 0 5px; background: var(--soft) }
.flag.note { background: var(--warn-soft); color: var(--warn) }
.empty { color: var(--muted); padding: 16px 4px }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px }
th, td { padding: 4px 6px; text-align: right; border-bottom: 1px solid var(--line) }
th:first-child, td:first-child { text-align: left }
th { font-size: 12px; color: var(--muted); font-weight: 600 }
tr.total td { font-weight: 700; border-bottom: 0 }
td.v { color: var(--good); font-weight: 700 }
.lenrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
#len { width: 76px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 16px }
.issue { display: block; width: 100%; background: none; border: 0; border-left: 3px solid var(--warn); padding: 5px 8px; text-align: left; margin-top: 5px; overflow-wrap: anywhere }
.issue.bad { border-left-color: var(--bad) }
.issue.ok { border-left-color: var(--good) }
button.issue:hover { background: var(--soft) }
.issue small { color: var(--muted); display: block }

#mapwrap { position: relative; min-width: 0; min-height: 0; background: #0a1418; overflow: hidden }
#map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none }
#map.drag { cursor: grabbing }
.chip { cursor: pointer }
.chip text { font: 700 12px var(--display); text-anchor: middle; dominant-baseline: central; pointer-events: none }
.chip:hover rect { stroke: #fff !important; stroke-width: 2 !important }
/* The marker stays solid while it flashes, so the size printed on the drawing never shows through */
@keyframes chipflash-rect { 50% { fill: #0b0f12 } }
@keyframes chipflash-text { 50% { fill: #ffffff } }
@keyframes chipflash-swatch { 50% { background: #0b0f12 } }
.chip.flash rect { animation: chipflash-rect 1.1s steps(1) infinite }
.chip.flash text { animation: chipflash-text 1.1s steps(1) infinite }
.swatch.flash { animation: chipflash-swatch 1.1s steps(1) infinite; outline: 1px solid var(--line) }
@media (prefers-reduced-motion: reduce) {
  .chip.flash rect, .chip.flash text, .swatch.flash { animation: none }
  .chip.flash rect { stroke: #fff !important; stroke-width: 3 !important; stroke-dasharray: 4 2 !important }
}
.chip .dot { fill: #ff5a1f; stroke: #fff; stroke-width: .8 }

.mapui { position: absolute; display: flex; gap: 6px }
#zoom { top: 10px; right: calc(10px + env(safe-area-inset-right, 0px)); flex-direction: column }
#zoom button { width: 36px; height: 36px; border: 0; border-radius: 8px; background: var(--panel); font-size: 19px; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.45) }

#tip { position: fixed; z-index: 30; pointer-events: none; width: 290px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; box-shadow: 0 6px 18px rgba(0,0,0,.35); font-size: 14px }
.tiphead { display: flex; align-items: center; gap: 8px; font-weight: 700 }
.tiphead .tag { min-width: 42px }
.tiphead span:last-child { font-weight: 500; color: var(--muted); font-size: 13px }
.kv { margin-top: 5px; overflow-wrap: anywhere }
.kv i { font-style: normal; color: var(--muted); font-size: 12px; display: block; line-height: 1.2 }

#detail { position: absolute; top: 0; right: 0; bottom: 0; width: min(370px, 100%); background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 14px 16px 24px; z-index: 5; display: flex; flex-direction: column; gap: 10px }
.dhead { display: flex; align-items: center; gap: 10px }
.dhead .tag { font-size: 19px; padding: 6px 9px; min-width: 56px }
.dhead div { min-width: 0; flex: 1 }
.dhead h2 { font: 700 19px/1.1 var(--display); margin: 0; overflow-wrap: anywhere }
.dhead small { color: var(--muted) }
#dclose { border: 0; background: var(--soft); border-radius: 8px; width: 34px; height: 34px; font-size: 18px }
.record { border-top: 1px solid var(--line); padding-top: 8px; display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 4px 10px; font-size: 14px }
.record dt { color: var(--muted); font-size: 13px } .record dd { margin: 0; overflow-wrap: anywhere; user-select: text; -webkit-user-select: text }
.copy { border: 1px solid var(--line); background: none; border-radius: 4px; font-size: 12px; padding: 0 6px; margin-left: 6px }
.callout { background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 6px 9px; font-size: 14px }
.callout.bad { background: var(--bad-soft); color: var(--bad) }

#modal { position: fixed; inset: 0; z-index: 40; background: rgba(5,15,20,.6); display: flex; align-items: center; justify-content: center; padding: 16px }
#modalbox { background: var(--panel); border-radius: 12px; width: min(620px, 100%); max-height: 100%; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px }
#modalbox h2 { font: 700 23px/1.1 var(--display); margin: 0; text-wrap: balance }
#drop { border: 2px dashed var(--line); border-radius: 10px; padding: 26px 14px; text-align: center; color: var(--muted) }
#drop.over { border-color: var(--accent); background: var(--soft) }
.sheetwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; margin-top: 6px }
.sheetex { width: auto; font-size: 13px }
.sheetex th, .sheetex td { text-align: left; white-space: nowrap; padding: 3px 8px; border-right: 1px solid var(--line) }
.sheetex th { background: var(--soft); color: var(--ink) }
.sheetex th.need { background: var(--mark) }
.sheetex tr:last-child td { border-bottom: 0 }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px }
.tile { background: var(--soft); border-radius: 8px; padding: 6px 10px } .tile b { font: 700 23px/1.1 var(--display); display: block } .tile span { font-size: 13px; color: var(--muted) }
.note { font-size: 13px; color: var(--muted) }
#toast { position: fixed; z-index: 50; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 7px 14px; border-radius: 8px; font-weight: 500; max-width: 90% }

@media (min-width: 821px) {
  #mapwrap.open #map { width: calc(100% - 370px) }
  #mapwrap.open #zoom { right: 380px }
}
@media (max-width: 820px) {
  h1, .wide { display: none }
  header { gap: 4px 8px } .yards button { padding: 4px 8px } .primary { padding: 6px 10px }
  #openUpload { order: 1 }
  #yards { order: 0 }
  #legend { order: 3; flex: 1 1 0; font-size: 12px } #legend .opt { display: none }
  .stamp { order: 4; font-size: 12px; max-width: 100% }
  main { display: flex; flex-direction: column }
  #mapwrap { order: -1; flex: 0 0 44%; }
  #panel { flex: 1; border-right: 0; border-top: 1px solid var(--line) }
  #zoom { top: 6px } #zoom button { width: 34px; height: 34px }
  #detail { position: fixed; top: auto; left: 0; right: 0; bottom: 0; width: 100%; max-height: 66%; border-left: 0; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; box-shadow: 0 -6px 20px rgba(0,0,0,.35); z-index: 20; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)) }
  .pane { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
}
</style>

<header>
  <h1>RYC Yard Board</h1>
  <div class="yards" id="yards" role="group" aria-label="Yard"></div>
  <div id="legend"></div>
  <span class="stamp" id="stamp"></span>
  <button class="primary" id="openUpload">Update<span class="wide"> sheet</span></button>
</header>

<main>
  <section id="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="t-find" aria-selected="true">Find</button>
      <button role="tab" id="t-vac" aria-selected="false">Vacancies</button>
      <button role="tab" id="t-sum" aria-selected="false">Summary</button>
      <button role="tab" id="t-chk" aria-selected="false">Checks <span class="count" id="chkCount" hidden></span></button>
    </div>
    <div class="pane" id="p-find">
      <input id="q" type="search" placeholder="Search member, boat, notes, partner, space" aria-label="Search" autocomplete="off">
      <div>
        <div class="label">Show only</div>
        <div class="chips" id="flagChips"></div>
      </div>
      <div>
        <div class="label">Space size</div>
        <div class="chips" id="sizeChips"></div>
      </div>
      <div>
        <div class="rowhead"><div class="label" id="resCount"></div><button class="link" id="clear" hidden>Clear all</button></div>
        <ul id="results"></ul>
      </div>
    </div>
    <div class="pane" id="p-vac" hidden>
      <div>
        <div class="label">Find a space for a boat</div>
        <div class="lenrow"><label for="len">Boat length (ft)</label><input id="len" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" placeholder="24"><button class="link" id="lenClear" hidden>Clear</button></div>
      </div>
      <div id="vacResults"></div>
    </div>
    <div class="pane" id="p-sum" hidden></div>
    <div class="pane" id="p-chk" hidden></div>
  </section>

  <section id="mapwrap">
    <svg id="map" role="application" aria-label="Yard map. Click a space for details."><image id="base" x="0" y="0"></image><g id="chips"></g></svg>
    <div class="mapui" id="zoom">
      <button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">&minus;</button><button id="zfit" aria-label="Fit whole yard" title="Fit whole yard">&#x26F6;</button>
    </div>
    <aside id="detail" hidden aria-live="polite"></aside>
  </section>
</main>

<div id="tip" hidden></div>
<div id="toast" hidden role="status"></div>
<div id="modal" hidden><div id="modalbox" role="dialog" aria-modal="true" aria-labelledby="mtitle"></div></div>
<input type="file" id="file" accept=".xlsx,.xls,.xlsm,.csv" hidden>

  $('p-chk').innerHTML = (rep ? `<div><div class="label">Last update: ${esc(rep.file)}</div>${reportHtml(rep.items)}</div>` : '') + (groups || '<p class="empty">No problems found in the sheet.</p>');
}
const reportHtml = items => items.length
  ? items.map(i => `<button class="issue ok" data-k="${esc(i.k)}"><b>${esc(i.kind)}</b> · Space ${esc(i.id)}<small>${esc(i.text)}</small></button>`).join('')
  : '<p class="note">No changes to boats, members or action notes.</p>';
function setTab(t) {
  ui.tab = t; ui.vacGroup = null;
  if (t === 'vac') renderVac(); else renderResults();
  for (const k of ['find', 'vac', 'sum', 'chk']) { $('t-' + k).setAttribute('aria-selected', k === t); $('p-' + k).hidden = k !== t; }
  paintMap();
}
for (const k of ['find', 'vac', 'sum', 'chk']) $('t-' + k).onclick = () => setTab(k);
function renderStamp() {
  $('stamp').hidden = !data.file;
  $('stamp').textContent = data.file ? `${data.file} · updated ${new Date(data.when).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}` : '';
}
function renderAll() { loadModel(); renderYardButtons(); drawLegend(); const sel = ui.sel; ui.sel = sel ? model.index[sel.yard + '|' + sel.key] || null : null; drawYard(); renderChips(); renderResults(); renderVac(); renderSummary(); renderChecks(); renderStamp(); renderDetail(); }

// ---------- Upload ----------
const modal = $('modal'), mbox = $('modalbox');
function closeModal() { modal.hidden = true; mbox.textContent = ''; }
// A few rows from the built-in sample, one for each yard and one vacancy
function sheetExample() {
  const [head, ...rows] = SAMPLE;
  const picks = [r => r[1] === 'Harbor' && r[0][0] === 'C' && r[2] !== +VACANT_ID, r => r[1] === 'SBY' && r[2] === +VACANT_ID, r => r[1] === 'West Lot' && r[2] !== +VACANT_ID].map(t => rows.find(t));
  return `<p class="note">The map needs <b>Space</b> and <b>member #</b> (highlighted). Add the others to fill in the pop-ups and search. Columns can be in any order, and capitals and spacing in the headings do not matter. Member # ${VACANT_ID} means vacant. Yard is SBY, West Lot or Harbor. The names below are made up. Scroll sideways to see every column.</p>
    <div class="sheetwrap"><table class="sheetex"><thead><tr>${head.map(h => `<th${['Space', 'member #'].includes(h) ? ' class="need"' : ''}>${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${picks.map(r => `<tr>${r.map(v => `<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function openUpload(msg) {
  modal.hidden = false;
  mbox.innerHTML = `<h2 id="mtitle">Update from the spreadsheet</h2>
    ${msg ? `<div class="callout bad">${esc(msg)}</div>` : ''}
    <div id="drop">Drag the saved .xlsx or .csv file here<br>or <button class="link" id="pick">choose a file</button></div>
    <div><div class="label">What the sheet should look like</div>${sheetExample()}</div>
    <p class="note">You will see what changed before anything on the map updates. In this preview, an update is saved only in this browser.</p>
    <div class="actions">${data.file ? '<button class="ghost" id="resetSample">Go back to sample data</button>' : ''}<button class="ghost" id="mcancel">Cancel</button></div>`;
  $('pick').onclick = () => $('file').click(); $('mcancel').onclick = closeModal;
  const r = $('resetSample'); if (r) r.onclick = () => { data = SAMPLE_DATA; persist(); closeModal(); renderAll(); toast('Back to sample data'); };
  const drop = $('drop');
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); }; drop.ondragleave = () => drop.classList.remove('over');
}
$('openUpload').onclick = () => openUpload();
$('file').onchange = e => { if (e.target.files[0]) handleFile(e.target.files[0]); e.target.value = ''; };
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) { if (modal.hidden) openUpload(); handleFile(f); } });
async function handleFile(file) {
  if (!window.XLSX) return openUpload('The spreadsheet reader did not load. Check your connection and reload the page.');
  let aoa;
  try {
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    const sheets = wb.SheetNames.map(n => XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: false, defval: '' }));
    aoa = sheets.filter(a => findHeader(a) >= 0).sort((a, b) => b.length - a.length)[0];
  } catch (err) { return openUpload(`"${file.name}" could not be read. Save it as .xlsx or .csv and try again.`); }
  if (!aoa) return openUpload(`"${file.name}" has no sheet with a "member #" column. Check that it is the slip spreadsheet.`);
  const heads = aoa[findHeader(aoa)].map(headKey);
  const chosen = data.spaceColumn == null ? -1 : heads.indexOf(headKey(data.aoa[findHeader(data.aoa)][data.spaceColumn]));
  reviewSheet(aoa, file.name, !heads.some(h => COLUMNS.space.includes(h)) && chosen >= 0 ? chosen : null);
}
function reviewSheet(aoa, name, spaceColumn) {
  const sheet = readSheet(aoa, spaceColumn);
  if (sheet.error) return openUpload(sheet.error);
  if (sheet.needSpace) {
    modal.hidden = false;
    mbox.innerHTML = `<h2 id="mtitle">Which column holds the space number?</h2><p>The map matches boats to spaces using a number like 072, PL03 or 161A. I could not find a column named "Space".</p>
      <label for="pickCol" class="label">Column</label><select id="pickCol">${sheet.needSpace.map(c => `<option value="${c.i}">${esc(c.name)}</option>`).join('')}</select>
      <div class="actions"><button class="ghost" id="mcancel">Cancel</button><button class="primary" id="useCol">Use this column</button></div>`;
    $('mcancel').onclick = closeModal; $('useCol').onclick = () => reviewSheet(aoa, name, +$('pickCol').value);
    return;
  }
  const next = buildModel(sheet), nextChecks = runChecks(next), changes = diffModels(model, next);
  const placed = sheet.rows.length - next.orphans.length, tally = st => next.spaces.filter(s => s.status === st).length;
  const serious = nextChecks.filter(c => c.kind !== 'none');
  const fatal = !placed;
  modal.hidden = false;
  mbox.innerHTML = `<h2 id="mtitle">Review ${esc(name)}</h2>
    <div class="tiles"><div class="tile"><b>${changes.length}</b><span>changes</span></div><div class="tile"><b>${tally('occupied')}</b><span>occupied</span></div><div class="tile"><b>${tally('vacant')}</b><span>vacant</span></div><div class="tile"><b>${serious.length}</b><span>to check</span></div></div>
    ${fatal ? '<div class="callout bad">None of the rows matched a space on the map. Check that the right column holds the space number.</div>' : ''}
    <div><div class="label">What changed</div>${changes.length ? changes.slice(0, 60).map(c => `<div class="issue ok"><b>${esc(c.kind)}</b> · Space ${esc(c.s.id)}, ${esc(c.s.yard)}<small>${esc(c.text)}</small></div>`).join('') + (changes.length > 60 ? `<p class="note">And ${changes.length - 60} more.</p>` : '') : '<p class="note">No changes to boats, members or action notes.</p>'}</div>
    ${serious.length ? `<div><div class="label">Worth checking</div>${serious.slice(0, 20).map(c => `<div class="issue ${c.bad ? 'bad' : ''}">${esc(c.title)}<small>${esc(c.sub || '')}</small></div>`).join('')}${serious.length > 20 ? `<p class="note">And ${serious.length - 20} more on the Checks tab.</p>` : ''}</div>` : ''}
    <div class="actions"><button class="ghost" id="mcancel">Cancel</button><button class="primary" id="mapply" ${fatal ? 'disabled' : ''}>Update the map</button></div>`;
  $('mcancel').onclick = closeModal;
  $('mapply').onclick = () => {
    data = { aoa, file: name, when: Date.now(), spaceColumn, report: { file: name, items: changes.map(c => ({ kind: c.kind, id: c.s.id, k: c.s.yard + '|' + c.s.key, text: c.text })) } };
    const saved = persist(); closeModal(); renderAll();
    toast((changes.length ? `Map updated: ${changes.length} ${changes.length === 1 ? 'change' : 'changes'}` : 'Map updated: no changes') + (saved ? '' : '. It could not be saved, so it will be gone after a reload.'));
  };
}

// ---------- Keyboard ----------
addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!modal.hidden) closeModal(); else if (ui.sel) select(null); else if (document.activeElement === $('q')) $('q').blur(); }
  if (e.key === '/' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) && modal.hidden) { e.preventDefault(); setTab('find'); $('q').focus(); }
});
new ResizeObserver(applyVB).observe(svg);
for (const d of Object.values(YARDS)) new Image().src = d.img;
renderAll();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitLabels);
</script>
